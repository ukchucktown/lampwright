name: Close integration issues

on:
  pull_request:
    types: [closed]
    branches:
      - feat/issue-148-session-setup-integration

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  close-issues:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Close referenced issues
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const body = context.payload.pull_request.body ?? "";
            const closingReference =
              /\b(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\s*:?\s+#(\d+)\b/gi;
            const issueNumbers = new Set();

            for (const match of body.matchAll(closingReference)) {
              issueNumbers.add(Number(match[1]));
            }

            for (const issue_number of issueNumbers) {
              const { data: issue } = await github.rest.issues.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number,
              });

              if (issue.pull_request) {
                core.warning(`#${issue_number} is a pull request; leaving it unchanged.`);
                continue;
              }

              if (issue.state === "closed") {
                continue;
              }

              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number,
                state: "closed",
                state_reason: "completed",
              });

              core.info(
                `Closed #${issue_number} after PR #${context.issue.number} merged into ${context.payload.pull_request.base.ref}.`,
              );
            }
