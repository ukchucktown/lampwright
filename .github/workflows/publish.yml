name: Publish to npm

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type the exact package name and version (for example, skill-cleaner@0.1.0)
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-production
  cancel-in-progress: false

jobs:
  publish:
    name: Verify and publish exact tag
    runs-on: ubuntu-latest
    environment: npm-production
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.x
          registry-url: https://registry.npmjs.org/
          package-manager-cache: false

      - name: Install provenance-capable npm CLI
        run: npm install --global npm@11.15.0

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Verify release authority
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_REF_TYPE: ${{ github.ref_type }}
          RELEASE_CONFIRMATION: ${{ inputs.confirmation }}
          REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
        run: node scripts/verify-release.mjs

      - name: Verify source and package
        run: |
          npm run format:check
          npm run lint
          npm run typecheck
          npm test
          npm run pack:check

      - name: Publish with provenance
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
